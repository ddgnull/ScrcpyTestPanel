name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 语法门禁 + 无头自检
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法门禁
        run: python -m compileall -q constants.py config_helper.py scrcpy_manager.py test_manager.py main_qt.py scripts

      - name: 生成构建信息
        run: python scripts/gen_build_info.py --version 0.0.0-dev

      - name: 无头自检
        run: python main_qt.py --selftest
